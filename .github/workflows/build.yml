name: Build RouterOS CN List

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build CN.rsc
        run: python scripts/build_cn_rsc.py

      - name: Commit and push if changed
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions"
          git add CN.rsc CN.count.txt CN.source.txt
          if ! git diff --cached --quiet; then
            git commit -m "Update CN RouterOS list"
            git push
          fi
